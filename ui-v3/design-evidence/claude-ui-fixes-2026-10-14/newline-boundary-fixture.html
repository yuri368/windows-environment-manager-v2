<!doctype html><meta charset="utf-8"><title>原始换行保真验收</title><link rel="stylesheet" href="/ui-polish.css"><link rel="stylesheet" href="/elements-ui.css"><link rel="stylesheet" href="/fx-ui.css"><style>body{padding:24px}#modal{margin-top:16px}.dialog{max-width:100%}pre{white-space:pre-wrap}</style><h1>原始换行保真验收</h1><button id="ordinary">测试普通原始换行</button><button id="special">测试整体原始换行</button><button id="delete-normal">普通：删除第一个换行</button><button id="insert-normal">普通：原换行前插入</button><button id="delete-special">整体：删除第一个换行</button><button id="insert-special">整体：原换行前插入</button><pre id="result"></pre><div id="modal"></div><script src="/demo-plan.js"></script><script src="/windows-elements.js"></script><script>const raw='甲\r\n乙\r丙\n丁';const container=document.getElementById('modal');function start(whole,sourceRaw=raw){document.getElementById('result').textContent='原始：'+JSON.stringify(sourceRaw);WindowsElements.open({container,raw:sourceRaw,name:'TEST_RAW',scope:'User',registryType:'REG_EXPAND_SZ',whole,close:()=>{WindowsElements.dismiss();container.classList.remove('open')},onApply:(value,audit,plan)=>{document.getElementById('result').textContent=JSON.stringify({raw:value,after:plan.after.raw,operations:plan.operations});}})}document.getElementById('ordinary').onclick=()=>start(false);document.getElementById('special').onclick=()=>start(true);document.getElementById('delete-normal').onclick=()=>start(false,'A\r\n\nB');document.getElementById('insert-normal').onclick=()=>start(false,'A\r\nB');document.getElementById('delete-special').onclick=()=>start(true,'A\r\n\nB');document.getElementById('insert-special').onclick=()=>start(true,'A\r\nB');</script>
