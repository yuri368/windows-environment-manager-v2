  $('screen').innerHTML=`<div class="fullpage history-page" style="width:100%"><div class="pageh"><div><h2>操作历史</h2><p>本次浏览器会话中的模拟记录 · 展开查看修改前后与元素变化</p></div><span class="tag neutral">${history.length} 条记录</span></div><table class="outline-table"><thead><tr><th style="width:190px">时间</th><th style="width:160px">操作</th><th>描述与详情</th></tr></thead><tbody>${history.map(h=>`<tr><td><span class="time-dot" aria-hidden="true"></span>${esc(h.when)}</td><td><span class="act-chip">${esc(h.action)}</span></td><td>${h.changes?.length?`<details class="history-details"><summary>${esc(h.detail)}<span class="history-expand">查看详情</span></summary><div class="history-detail-body">${h.changes.map(historyChangeMarkup).join('')}<p class="sub mini">仅更新本页演示数据；此记录不提供真实环境恢复。</p></div></details>`:esc(h.detail)}</td></tr>`).join('')}</tbody></table></div>`;
  $('footer').innerHTML=`<div class="footer-summary"><strong>模拟操作日志</strong><small>这里不代表真实软件的可撤销历史</small></div><button class="btn" id="toWork">返回工作台</button>`;$('toWork').onclick=()=>go('workbench');
}
function configProfile(){const a=apps[editor.app];return a.profiles.find(p=>p.name===editor.profile)||a.profiles[0]}
function configVar(){return configProfile().vars[editor.varIdx]||configProfile().vars[0]}
const CONFIG_FIELDS = [['defaultValue','默认值'],['scope','作用域'],['mode','模式'],['special','整体处理']];
function configChanges() {
  return apps.flatMap((a,i)=>a.profiles.flatMap(p=>p.vars.flatMap((v,j)=>{
    const m=initialApps[i].profiles.find(x=>x.name===p.name).vars[j];
    const original={defaultValue:m[3],scope:m[1],mode:m[2],special:!!m[4]?.special};
    return CONFIG_FIELDS.filter(([field])=>v[field]!==original[field]).map(([field,label])=>({app:a.name,profile:p.name,name:v.name,field,label,before:original[field],after:v[field]}));
  })));
}
function updateConfigStatus() {
  const count=configChanges().length;
  if ($('configStatus')) { $('configStatus').textContent=count?`配置修改 · ${count} 项属性修改 · 仅本页保留`:'配置修改未修改 · 编辑不会更改真实文件';$('configStatus').classList.toggle('has-changes',count>0); }
  if ($('cancelConfig')) $('cancelConfig').disabled=count===0;
  const badge=$('configDraftBadge');
  if (badge) { badge.hidden=!count; badge.textContent=`${count} 项属性修改`; }
}
function restoreConfig() {
  apps.forEach((a,i)=>a.profiles.forEach(p=>p.vars.forEach((v,j)=>{
    const m=initialApps[i].profiles.find(x=>x.name===p.name).vars[j];
    const contextChanged=v.scope!==m[1]||v.mode!==m[2]||v.special!==!!m[4]?.special||(v.source==='默认值'&&v.defaultValue!==m[3]);
    Object.assign(v,{defaultValue:m[3],scope:m[1],mode:m[2],special:!!m[4]?.special});if(contextChanged)v.matchBaseline=null;v.dirty=hasPendingValue(v);
  })));
  renderConfig();$('downloadToml').focus();notify('已还原配置修改，页面环境快照未改变');
}
function renderConfig() {
  $('screen').innerHTML=`<div class="config-page"><div class="editor-tabs"><button class="navtab ${editor.tab==='visual'?'active':''}" data-edtab="visual" aria-current="${editor.tab==='visual'?'page':'false'}">可视化</button><button class="navtab ${editor.tab==='raw'?'active':''}" data-edtab="raw" aria-current="${editor.tab==='raw'?'page':'false'}">示例 TOML</button><button class="navtab ${editor.tab==='diff'?'active':''}" data-edtab="diff" aria-current="${editor.tab==='diff'?'page':'false'}">修改差异</button><span id="configDraftBadge" class="tag dirty" hidden></span><span class="config-file-label">env.toml · 演示配置</span></div><div id="editorbody" class="editor-body"></div><div class="edfooter"><span id="configStatus" role="status"></span><button class="btn" id="cancelConfig" title="还原全部方案的默认值、作用域、模式及整体处理属性">还原配置修改</button><button class="btn primary" id="downloadToml">导出 TOML 文件 ↓</button></div></div>`;
  document.querySelectorAll('[data-edtab]').forEach(b=>b.onclick=()=>{
    editor.tab=b.dataset.edtab;renderConfig();document.querySelector(`[data-edtab="${editor.tab}"]`).focus();
  });
  $('cancelConfig').onclick=restoreConfig;$('downloadToml').onclick=downloadToml;
  renderEditorBody();updateConfigStatus();
}
function renderEditorBody(focusId) {
  const root = $('editorbody'), a = apps[editor.app], p = configProfile();
  if (editor.tab !== 'visual') {
    const raw = editor.tab === 'raw';
    root.innerHTML = `<div class="fullpage" style="width:100%"><div class="pageh"><div><h2>${raw ? '示例 TOML' : '当前修改差异'}</h2><p>${raw ? '由演示数据生成。正式文件的解析与无损保存将在后端接入时处理。' : '比较本页配置修改的属性修改；不涉及系统环境写入。'}</p></div><button class="btn" id="copyText">复制内容</button></div><pre class="codetext" id="sourceText">${esc(raw ? generateToml() : generateDiff())}</pre></div>`;
    $('copyText').onclick = async () => {
      try {
        if (!navigator.clipboard) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText($('sourceText').innerText);
        notify('已复制');
      } catch { notify('浏览器不允许直接复制，请手动选中复制'); }
    };
    return;
  }
  const visibleProfiles = editor.showAll ? a.profiles : [p];
  const groups = visibleProfiles.map(profile => `
    <tr class="scheme-group"><th colspan="4"><div class="scheme-heading"><span class="scheme-name">${esc(profile.name)}</span><span class="group-meta">${profile.vars.length} 项变量</span><span class="scheme-flags">${[profile.name === a.default ? '默认方案' : '', profile.name === p.name ? '当前编辑' : ''].filter(Boolean).join(' · ')}</span></div></th></tr>
    ${profile.vars.map((v, i) => `<tr tabindex="0" class="${profile.name === p.name && i === editor.varIdx ? 'active' : ''}" data-tableplan="${esc(profile.name)}" data-tablevar="${i}" aria-current="${profile.name===p.name&&i===editor.varIdx?'true':'false'}" aria-label="编辑 ${esc(profile.name)} 的 ${esc(v.name)}"><td><strong>${esc(v.name)}</strong></td><td>${v.scope === 'User' ? '用户' : '系统'}</td><td>${esc(MODE[v.mode])}</td><td title="${esc(v.defaultValue)}">${esc(v.defaultValue)}</td></tr>`).join('')}
  `).join('');
  root.innerHTML = `<div class="editor-shell" style="width:100%">
    <aside class="editor-left"><section class="editor-nav-group"><div class="editor-section"><strong id="editorAppsHeading">应用</strong><span class="mini sub">${apps.length} 项</span></div><div class="editor-nav-list" data-editor-list="apps" aria-labelledby="editorAppsHeading">
      ${apps.map((x,i) => `<button class="editor-item ${editor.app === i ? 'active' : ''}" data-editapp="${i}" aria-current="${editor.app===i?'true':'false'}" title="${esc(x.name)}">${esc(x.name)}<span class="sub mini">›</span></button>`).join('')}
      </div></section><section class="editor-nav-group"><div class="editor-section"><strong id="editorProfilesHeading">方案</strong><span class="mini sub">${a.profiles.length} 项</span></div><div class="editor-nav-list" data-editor-list="profiles" aria-labelledby="editorProfilesHeading">
      ${a.profiles.map(x => `<button class="editor-item ${p.name === x.name ? 'active' : ''}" data-editplan="${esc(x.name)}" aria-current="${p.name===x.name?'true':'false'}" title="${esc(x.name)}">${esc(x.name)}${x.name === a.default ? ' · 默认' : ''}</button>`).join('')}
      </div></section></aside>
    <main class="editor-mid"><div class="eyebrow">配置 / ${esc(a.name)}</div><h2>${esc(a.name)}</h2><div class="littlemeta">正在编辑 ${esc(p.name)} · ${p.vars.length} 项变量 · 默认方案 ${esc(a.default)}</div>
      <div class="sectionbar"><h2>方案变量</h2><select id="editorView" class="view-select" aria-label="配置方案显示范围"><option value="current" ${!editor.showAll ? 'selected' : ''}>当前方案</option><option value="all" ${editor.showAll ? 'selected' : ''}>全部方案</option></select></div>
      <table class="editor-table"><thead><tr><th>变量名称</th><th>作用域</th><th>模式</th><th>默认值</th></tr></thead><tbody>${groups}</tbody></table>
      <p class="helpnote">选择变量编辑属性。这里的修改属于配置修改，不会应用到系统环境。</p>
    </main><aside class="editor-right" id="editorInspector"></aside>
  </div>`;
  $('editorView').onchange = e => { editor.showAll = e.target.value === 'all'; renderEditorBody('editorView'); };
  root.querySelectorAll('[data-editapp]').forEach(b => b.onclick = () => { editor.app = +b.dataset.editapp; editor.profile = apps[editor.app].default; editor.varIdx = 0; renderEditorBody();root.querySelectorAll('[data-editapp]')[editor.app]?.focus(); });
  root.querySelectorAll('[data-editplan]').forEach(b => b.onclick = () => { editor.profile = b.dataset.editplan; editor.varIdx = 0; renderEditorBody();[...root.querySelectorAll('[data-editplan]')].find(el=>el.dataset.editplan===editor.profile)?.focus(); });
  root.querySelectorAll('[data-tableplan]').forEach(row => {
    const choose = () => { editor.profile = row.dataset.tableplan; editor.varIdx = +row.dataset.tablevar; renderEditorBody();[...root.querySelectorAll('[data-tableplan]')].find(el=>el.dataset.tableplan===editor.profile&&+el.dataset.tablevar===editor.varIdx)?.focus(); };
    row.onclick = choose;
    row.onkeydown = e => {
      if(e.key==='Enter'||e.key===' '){e.preventDefault();choose();return;}
      if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;
      e.preventDefault();const rows=[...root.querySelectorAll('[data-tableplan]')],position=rows.indexOf(row);
      const next=e.key==='Home'?0:e.key==='End'?rows.length-1:Math.max(0,Math.min(rows.length-1,position+(e.key==='ArrowDown'?1:-1)));
      rows[next]?.click();
    };
  });
  renderEditorInspector();updateConfigStatus();
  if (focusId) $(focusId)?.focus();
}
function renderEditorInspector(){const v=configVar();$('editorInspector').innerHTML=`<h3>${esc(v.name)}</h3><div class="inspector-context">${esc(apps[editor.app].name)} / ${esc(configProfile().name)} · 变量属性</div><div class="field"><label for="cfgName">变量名</label><input id="cfgName" value="${esc(v.name)}" disabled title="演示中变量名固定，不支持重命名"></div><div class="field"><label for="cfgScope">作用域</label><select id="cfgScope"><option value="User" ${v.scope==='User'?'selected':''}>用户 (User)</option><option value="System" ${v.scope==='System'?'selected':''}>系统 (System)</option></select></div><div class="field"><label for="cfgMode">模式</label><select id="cfgMode">${Object.entries(MODE).map(([k,x])=>`<option value="${k}" ${v.mode===k?'selected':''} ${v.special&&k!=='replace'?'disabled':''}>${esc(k)} · ${x}</option>`).join('')}</select></div><div class="field"><label for="cfgDefault">默认值（保留原始字符串）</label><textarea id="cfgDefault" spellcheck="false">${esc(v.defaultValue)}</textarea></div><div class="field"><label for="cfgSaved">已保存值（只读演示数据）</label><input id="cfgSaved" value="${esc(v.savedValue??'（无）')}" disabled></div><div class="field"><label for="cfgSource">当前选定值来源</label><input id="cfgSource" value="${esc(v.source)}" disabled></div><label class="checklabel" style="margin-top:5px"><input type="checkbox" id="cfgSpecial" ${v.special?'checked':''}>特殊变量 (Special)</label><p class="helpnote">特殊变量的值作为一个整体处理。配置修改保留在此演示状态中，可以导出为新 TOML 文件。工作台使用“默认值”来源时会跟随此处默认值修改；其他来源保持原选定值，仍需预览确认才更新演示环境。</p>`;
 $('cfgScope').onchange=e=>{v.matchBaseline=null;v.scope=e.target.value;renderEditorBody('cfgScope')};$('cfgMode').onchange=e=>{v.matchBaseline=null;v.mode=e.target.value;renderEditorBody('cfgMode')};$('cfgDefault').oninput=e=>{if(v.source==='默认值')beginSelectedEdit(v,e.target.value);v.defaultValue=e.target.value;v.dirty=hasPendingValue(v);const trs=document.querySelectorAll('[data-tableplan]');trs.forEach(tr=>{if(tr.dataset.tableplan===configProfile().name&&+tr.dataset.tablevar===editor.varIdx){const td=tr.lastElementChild;td.textContent=v.defaultValue;td.title=v.defaultValue}});updateConfigStatus()};$('cfgSpecial').onchange=e=>{v.matchBaseline=null;v.special=e.target.checked;if(v.special)v.mode='replace';renderEditorBody('cfgSpecial')}}
function tomlQuote(s){return '"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r/g,'\\r').replace(/\n/g,'\\n')+'"'}
function generateToml(){let out=['# 由 Compact UI 演示生成（示例结构，非仓库配置格式的正式序列化）',''];apps.forEach(a=>{out.push('# '+a.name);a.profiles.forEach(p=>{out.push('[[application]]');out.push('name = '+tomlQuote(a.name));out.push('profile = '+tomlQuote(p.name));out.push('default_profile = '+(a.default===p.name?'true':'false'));p.vars.forEach(v=>{out.push('[[application.variable]]');out.push('name = '+tomlQuote(v.name));out.push('scope = '+tomlQuote(v.scope));out.push('mode = '+tomlQuote(v.mode));out.push('default_value = '+tomlQuote(v.defaultValue));if(v.special)out.push('special = true')});out.push('')})});return out.join('\n')}
function generateDiff() {
  const display=(field,val)=>field==='special'?(val?'是':'否'):String(val);
  return configChanges().map(c=>`${c.app} / ${c.profile} / ${c.name} · ${c.label}\n  原始：${display(c.field,c.before)}\n  修改：${display(c.field,c.after)}`).join('\n\n')||'目前没有配置属性修改。';
}
function downloadToml(){const b=new Blob([generateToml()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='env.compact-demo.toml';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('已生成演示 TOML（非仓库正式格式）')}

document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !$('modal').classList.contains('open')) return;
  const controls = [...$('modal').querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex="0"]')].filter(el=>!el.closest('[hidden]'));
  const first = controls[0], last = controls[controls.length - 1];
  if (!first) return;
  if (!$('modal').contains(document.activeElement)) { e.preventDefault();first.focus();return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('refreshBtn').onclick=()=>{revision++;render();notify('重新检测完成（基于当前模拟数据）')};$('configBtn').onclick=()=>go('config');$('resetBtn').onclick=()=>{if(confirm('将所有演示数据重置为初始状态？'))reset()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.addEventListener('click',e=>{if(!e.target.closest('#planField')&&!e.target.closest('.btndrop'))closeDropdowns()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDropdowns()}if((e.ctrlKey||e.metaKey)&&['s','f'].includes(e.key.toLowerCase())&&$('modal').classList.contains('open')){e.preventDefault();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('modal').classList.contains('open')){e.preventDefault();downloadToml()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&screen==='workbench'&&!$('modal').classList.contains('open')){e.preventDefault();$('appSearch').focus()}});$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};reset(true);
