function changeCountText(counts){return [['added','新增'],['removed','删除'],['replaced','替换'],['moved','移动']].filter(([kind])=>counts[kind]).map(([kind,label])=>`${label} ${counts[kind]}`).join(' · ')||'整体值修改'}
function historyValue(raw){return raw===undefined?'（不存在）':raw===''?'（空字符串）':esc(raw)}
function historyElementValue(raw){return raw===undefined?'—':raw===''?'（空元素）':esc(raw)}
function historyChangeMarkup(c){
  const changed=c.whole?[]:(c.elements||[]).filter(e=>e.added||e.removed||e.replaced||e.moved);
  return `<section class="history-change"${c.elements?.length?' data-linked-elements':''}><div class="history-change-heading"><strong>${c.scope==='User'?'用户':'系统'} / ${esc(c.name)}</strong><span class="sub mini">${c.whole?'整体值':'元素列表'}${c.mode?' · '+esc(c.mode==='batch'?'批量合并':MODE[c.mode]||'元素编辑'):''}${c.unchanged?' · 无需变化':''}</span></div>
    ${c.app?`<p class="history-source">来源：${esc(c.app)} / ${esc(c.profile)}</p>`:''}
    ${!c.elements&&c.operations?.length?`<p class="history-counts">${esc(planSummary(c.plan))}</p>`:''}
    ${c.counts&&!c.whole?`<p class="history-counts">${esc(changeCountText(c.counts))} <span class="sub mini">同一元素可同时计入替换与移动</span></p>`:''}
    <div class="history-structure"><div><span class="flow-label">修改前 · 记录快照</span>${valueStreamMarkup(WindowsElements.historyMarkup(c.before,{whole:c.whole,elements:c.elements,side:'before'}),'','历史修改前')}</div><div><span class="flow-label">修改后 · 记录快照</span>${valueStreamMarkup(WindowsElements.historyMarkup(c.after,{whole:c.whole,elements:c.elements,side:'after'}),'','历史修改后')}</div></div>${c.elements?.length?'<p class="stream-help">悬停或聚焦元素与下方明细，追踪同一项的修改前后。方向键定位，明细使用 ↑↓。</p>':''}<details class="raw-disclosure"><summary>完整原始字符串</summary><div class="history-values"><div><span class="k">修改前</span><pre class="history-before">${historyValue(c.before)}</pre></div><div><span class="k">修改后</span><pre class="history-after">${historyValue(c.after)}</pre></div></div></details>
    ${changed.length?`<table class="history-element-table"><thead><tr><th>位置（原 → 新）</th><th>状态</th><th>原元素</th><th>新元素</th></tr></thead><tbody>${changed.map((e,index)=>`<tr data-related-key="history:${esc(e.elementId)}" tabindex="${index===0?0:-1}"><td>${e.beforeIndex===null?'—':e.beforeIndex+1} → ${e.afterIndex===null?'—':e.afterIndex+1}</td><td>${[['added','新增'],['removed','删除'],['replaced','替换'],['moved','移动']].filter(([kind])=>e[kind]).map(([kind,label])=>`<span class="diff-label is-${kind}">${label}</span>`).join('')}</td><td><code>${historyElementValue(e.before)}</code></td><td><code>${historyElementValue(e.after)}</code></td></tr>`).join('')}</tbody></table>`:''}
  </section>`;
}
function renderHistory(){
  $('screen').innerHTML=`<div class="fullpage history-page" style="width:100%"><div class="pageh"><div><h2>操作历史</h2><p>本次浏览器会话中的模拟记录 · 展开查看修改前后与元素变化</p></div><span class="tag neutral">${history.length} 条记录</span></div><table class="outline-table"><thead><tr><th style="width:190px">时间</th><th style="width:160px">操作</th><th>描述与详情</th></tr></thead><tbody>${history.map((h,historyIndex)=>`<tr data-history-index="${historyIndex}"><td><span class="time-dot" aria-hidden="true"></span>${esc(h.when)}</td><td><span class="act-chip">${esc(h.action)}</span></td><td>${h.changes?.length?`<details class="history-details"><summary>${esc(h.detail)}<span class="history-expand">查看详情</span></summary><div class="history-detail-body">${h.changes.map(historyChangeMarkup).join('')}<p class="sub mini">仅更新本页演示数据；此记录不提供真实环境恢复。</p></div></details>`:esc(h.detail)}</td></tr>`).join('')}</tbody></table></div>`;
  $('screen').querySelectorAll('[data-history-index]').forEach(row=>{

      section.querySelector('.history-after').textContent=c.after===undefined?'（不存在）':c.after===''?'（空字符串）':c.after;
      const table=section.querySelector('.history-element-table');
      if(table){bindListKeys(table,'tbody tr[data-related-key]');table.onfocusin=e=>{const row=e.target.closest('tr[data-related-key]');if(row)table.querySelectorAll('tbody tr').forEach(item=>item.tabIndex=item===row?0:-1)}};
    });
    const details=row.querySelector('.history-details');
    if(details)details.addEventListener('toggle',()=>{const caption=details.querySelector('.history-expand');caption.textContent=details.open?'收起详情':'查看详情';if(details.open)decorateValueStreams(details)});
  });
  $('footer').innerHTML=`<div class="footer-summary"><strong>模拟操作日志</strong><small>这里不代表真实软件的可撤销历史</small></div><button class="btn" id="toWork">返回工作台</button>`;$('toWork').onclick=()=>go('workbench');
}
function configProfile(){const a=apps[editor.app];return a.profiles.find(p=>p.name===editor.profile)||a.profiles[0]}
function configVar(){return configProfile().vars[editor.varIdx]||configProfile().vars[0]}
const CONFIG_FIELDS = [['defaultValue','默认值'],['scope','作用域'],['mode','模式'],['special','整体处理'],['editable','运行时自由输入'],['choices','候选值']];
function configChanges() {
  return apps.flatMap((a,i)=>a.profiles.flatMap(p=>p.vars.flatMap((v,j)=>{
    const m=initialApps[i].profiles.find(x=>x.name===p.name).vars[j];
    const original={defaultValue:m[3],scope:m[1],mode:m[2],special:!!m[4]?.special,editable:m[4]?.editable??true,choices:ConfigFormat.choices({choices:m[4]?.choices||[]})};
    return CONFIG_FIELDS.filter(([field])=>JSON.stringify(field==='choices'?ConfigFormat.choices(v):v[field])!==JSON.stringify(original[field])).map(([field,label])=>({app:a.name,profile:p.name,name:v.name,field,label,before:original[field],after:field==='choices'?ConfigFormat.choices(v):v[field]}));
  })));
}
function updateConfigStatus() {
  const count=configChanges().length;
  const errors=ConfigFormat.errors(apps);
  if ($('configStatus')) { $('configStatus').textContent=(count?`配置修改 · ${count} 项属性修改 · 仅本页保留`:'配置修改未修改 · 编辑不会更改真实文件')+(errors.length?` · ${errors.length} 项错误，暂不能导出`:'');$('configStatus').classList.toggle('has-changes',count>0); }
  if($('downloadToml')){$('downloadToml').disabled=errors.length>0;$('downloadToml').title=errors.length?errors[0].message:'导出符合 V2 配置格式的新文件';}
  if ($('cancelConfig')) $('cancelConfig').disabled=count===0;
  const badge=$('configDraftBadge');
  if (badge) { badge.hidden=!count; badge.textContent=`${count} 项属性修改`; }
}
function restoreConfig() {
  apps.forEach((a,i)=>a.profiles.forEach(p=>p.vars.forEach((v,j)=>{
    const m=initialApps[i].profiles.find(x=>x.name===p.name).vars[j];
    const contextChanged=v.scope!==m[1]||v.mode!==m[2]||v.special!==!!m[4]?.special||(v.source==='默认值'&&v.defaultValue!==m[3]);
    const selectedChoice=v.source.startsWith('候选值 ')?ConfigFormat.choices(v)[+v.source.slice(4)-1]:null;
    Object.assign(v,{defaultValue:m[3],scope:m[1],mode:m[2],special:!!m[4]?.special,editable:m[4]?.editable??true,choices:ConfigFormat.choices({choices:m[4]?.choices||[]})});
    if(contextChanged||selectedChoice)v.matchBaseline=null;
    if(selectedChoice){const restored=v.choices.findIndex(c=>c.label===selectedChoice.label&&c.value===selectedChoice.value);v.source=restored>=0?'候选值 '+(restored+1):'默认值';}
    v.dirty=hasPendingValue(v);
  })));
  renderConfig();$('downloadToml').focus();notify('已还原配置修改，页面环境快照未改变');
}
function renderConfig() {
  $('screen').innerHTML=`<div class="config-page"><div class="editor-tabs"><div class="config-view-tabs" role="tablist" aria-label="配置视图"><button id="configTabVisual" role="tab" aria-selected="${editor.tab==='visual'}" tabindex="${editor.tab==='visual'?0:-1}" aria-controls="editorbody" class="navtab ${editor.tab==='visual'?'active':''}" data-edtab="visual" aria-current="${editor.tab==='visual'?'page':'false'}">可视化</button><button id="configTabRaw" role="tab" aria-selected="${editor.tab==='raw'}" tabindex="${editor.tab==='raw'?0:-1}" aria-controls="editorbody" class="navtab ${editor.tab==='raw'?'active':''}" data-edtab="raw" aria-current="${editor.tab==='raw'?'page':'false'}">示例 TOML</button><button id="configTabDiff" role="tab" aria-selected="${editor.tab==='diff'}" tabindex="${editor.tab==='diff'?0:-1}" aria-controls="editorbody" class="navtab ${editor.tab==='diff'?'active':''}" data-edtab="diff" aria-current="${editor.tab==='diff'?'page':'false'}">修改差异</button></div><span id="configDraftBadge" class="tag dirty" hidden></span><span class="config-file-label">env.toml · 演示配置</span></div><div id="editorbody" class="editor-body" role="tabpanel" aria-labelledby="configTab${{visual:'Visual',raw:'Raw',diff:'Diff'}[editor.tab]}"></div><div class="edfooter"><span id="configStatus" role="status"></span><button class="btn" id="cancelConfig" title="还原全部方案的默认值、候选值、作用域、模式、整体处理及自由输入属性">还原配置修改</button><button class="btn primary" id="downloadToml">导出 TOML 文件 ↓</button></div></div>`;
  document.querySelectorAll('[data-edtab]').forEach(b=>b.onclick=()=>{

function renderEditorBody(focusId) {
  const root = $('editorbody');
  if (editor.tab !== 'visual') {
    const raw = editor.tab === 'raw';
    root.innerHTML = `<div class="fullpage" style="width:100%"><div class="pageh"><div><h2>${raw ? '示例 TOML' : '当前修改差异'}</h2><p>${raw ? '按 V2 配置格式生成；此处预览当前草稿，导出前会检查字段与候选值规则。' : '比较本页配置修改的属性修改；不涉及系统环境写入。'}</p></div><button class="btn" id="copyText">复制内容</button></div><pre class="codetext" id="sourceText">${esc(raw ? generateToml(true) : generateDiff())}</pre></div>`;
    $('copyText').onclick = async event => {
      const button=event.currentTarget,text=$('sourceText').textContent;
      try {
        if (!navigator.clipboard) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(text);
        if(!button.isConnected)return;
        button.textContent='已复制';button.dataset.copyState='copied';button.setAttribute('aria-label','已复制内容');setTimeout(()=>{if(button.isConnected){button.textContent='复制内容';button.removeAttribute('data-copy-state');button.removeAttribute('aria-label')}},1800);notify('已复制');

}
function setConfigProperty(v,field,next,meta={}){
 const selectedChoice=v.source.startsWith('候选值 ')?+v.source.slice(4)-1:null;
 if(field==='defaultValue'&&v.source==='默认值')beginSelectedEdit(v,next);
 if(field==='choices'&&selectedChoice!==null){
  if(meta.action==='edit'&&meta.field==='value'&&meta.index===selectedChoice)beginSelectedEdit(v,next[selectedChoice].value);
  if(meta.action==='move'){
   if(selectedChoice===meta.from)v.source='候选值 '+(meta.to+1);
   else if(selectedChoice===meta.to)v.source='候选值 '+(meta.from+1);
  }else if(meta.action==='remove'){
   if(selectedChoice===meta.index){beginSelectedEdit(v,v.defaultValue);v.source='默认值';}
   else if(selectedChoice>meta.index)v.source='候选值 '+selectedChoice;
  }
 }
 v[field]=next;
 if(['scope','mode','special'].includes(field))v.matchBaseline=null;
 if(field==='special'&&next)v.mode='replace';
 if(field==='editable'&&!next&&v.source==='自定义值'){v.source='默认值';v.matchBaseline=null;}
 v.dirty=hasPendingValue(v);
}
function generateToml(preview=false){return ConfigFormat.serialize(apps,{validate:!preview})}
function generateDiff() {
  const display=(field,val)=>['special','editable'].includes(field)?(val?'是':'否'):field==='choices'?JSON.stringify(val):String(val);
  return configChanges().map(c=>`${c.app} / ${c.profile} / ${c.name} · ${c.label}\n  原始：${display(c.field,c.before)}\n  修改：${display(c.field,c.after)}`).join('\n\n')||'目前没有配置属性修改。';
}
function downloadToml(){const issues=ConfigFormat.errors(apps);if(issues.length){notify('配置尚不能导出：'+issues[0].message);return;}const b=new Blob([generateToml()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='env.compact-demo.toml';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('已生成 V2 格式的演示配置文件')}

document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !$('modal').classList.contains('open')) return;
  const controls = [...$('modal').querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), summary, [tabindex="0"]')].filter(el=>!el.closest('[hidden]'));
  const first = controls[0], last = controls[controls.length - 1];
  if (!first) return;
  if (!$('modal').contains(document.activeElement)) { e.preventDefault();first.focus();return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('refreshBtn').onclick=()=>{revision++;render();notify('重新检测完成（基于当前模拟数据）')};$('configBtn').onclick=()=>go('config');$('resetBtn').onclick=()=>{if(confirm('将所有演示数据重置为初始状态？'))reset()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.addEventListener('click',e=>{if(!e.target.closest('#planField')&&!e.target.closest('.btndrop'))closeDropdowns()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDropdowns()}if((e.ctrlKey||e.metaKey)&&['s','f'].includes(e.key.toLowerCase())&&$('modal').classList.contains('open')){e.preventDefault();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('modal').classList.contains('open')){e.preventDefault();downloadToml()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&screen==='workbench'&&!$('modal').classList.contains('open')){e.preventDefault();$('appSearch').focus()}});$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};reset(true);
