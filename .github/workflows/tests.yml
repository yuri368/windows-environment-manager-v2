name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1 libegl1 libopengl0 libxkbcommon0 libfontconfig1 fonts-noto-cjk

      - name: Create project virtual environment
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Python dependencies and record environment
        run: |
          mkdir -p artifacts/ci-results
          python -m pip install --disable-pip-version-check -r requirements.txt 2>&1 | tee artifacts/ci-results/install.log
          {
            python -c "import platform, sys; print('Executable:', sys.executable); print('Python:', sys.version); print('Platform:', platform.platform())"
            python -c "from PySide6.QtCore import qVersion; from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt:', qVersion()); print('Qt platform:', app.platformName())"
            python -m pip freeze
          } 2>&1 | tee artifacts/ci-results/environment.log

      - name: Run all unit, vNext and GUI regression tests
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/ci-results/unittest.log
          test_exit=${PIPESTATUS[0]}
          printf '%s\n' "$test_exit" > artifacts/ci-results/exit-code.txt
          exit "$test_exit"

      - name: Publish test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          folder = Path("artifacts/ci-results")
          folder.mkdir(parents=True, exist_ok=True)
          log = folder / "unittest.log"
          lines = log.read_text(encoding="utf-8", errors="replace").splitlines() if log.exists() else []
          totals = [line for line in lines if line.startswith(("Ran ", "OK", "FAILED ("))]
          skipped = [line for line in lines if " ... skipped " in line]
          exit_file = folder / "exit-code.txt"
          exit_code = exit_file.read_text().strip() if exit_file.exists() else "not recorded"
          environment = folder / "environment.log"
          details = environment.read_text(encoding="utf-8", errors="replace") if environment.exists() else "Environment setup did not complete."
          report = [
              f"## Tests: {os.environ.get('RUNNER_OS', 'unknown platform')}",
              "", "Command: `python -m unittest discover -s tests -v`",
              "", "GUI platform: `QT_QPA_PLATFORM=offscreen`; Windows native visibility probe uses its own `windows` process.",
              "", f"Exit code: `{exit_code}`",
              "", "```text", *(totals or ["No completed suite summary; inspect the job failure and artifact logs."]), "```",
              "", "### Skipped tests and original reasons", "",
              "```text", *(skipped or ["No reported skips." if log.exists() else "Tests did not start."]), "```",
              "", "### Runtime and pinned packages", "", "```text", details.rstrip(), "```",
              "", "Registry tests use only HKCU/Software/EnvironmentManagerV2Tests/<UUID>; both logical scopes are isolated there.",
              "", "Manual UAC, real HKLM/environment writes, installed-app checks and physical high-DPI acceptance are outside this CI suite.",
          ]
          markdown = "\n".join(report) + "\n"
          (folder / "summary.md").write_text(markdown, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(markdown)
          PY

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-python-3.13
          path: artifacts/ci-results/
          if-no-files-found: warn
          retention-days: 14
