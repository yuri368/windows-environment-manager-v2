# Windows 环境变量管理器 V2 示例配置。
# 路径、端点、名称和值均为示例，不包含个人令牌或真实安装路径。
# 结构：[应用.方案]；同名双作用域使用恰好两条内联表组成的数组。

[Java.JDK17]
JAVA_HOME = { default_value = 'C:\Tools\Java\jdk-17', scope = "User", mode = "replace", editable = false }
Path = { default_value = '%JAVA_HOME%\bin', scope = "User", mode = "+append", editable = false }

[Java.JDK21]
JAVA_HOME = { default_value = 'C:\Tools\Java\jdk-21', scope = "User", mode = "replace", editable = false }
Path = { default_value = '%JAVA_HOME%\bin', scope = "User", mode = "+append", editable = false }

[Python.Python313]
PYTHON_HOME = { default_value = 'C:\Tools\Python313', scope = "User", mode = "replace", editable = false }
Path = { default_value = '%PYTHON_HOME%;%PYTHON_HOME%\Scripts', scope = "User", mode = "append", editable = false }

[NodeJS.Portable]
NODE_HOME = { default_value = 'C:\Tools\NodeJS', scope = "User", mode = "replace", editable = false }
Path = { default_value = '%NODE_HOME%', scope = "User", mode = "-append", editable = false }

[Maven.Default]
MAVEN_HOME = { default_value = 'C:\Tools\Maven', scope = "User", mode = "replace", editable = false, choices = [{ label = "Maven 3", value = 'C:\Tools\Maven' }, { label = "Maven 4 preview", value = 'C:\Tools\MavenPreview' }] }

[CustomList.Example]
MY_TOOL_LIST = { default_value = 'Alpha;Beta;Gamma', scope = "User", mode = "+append", editable = true }

[EmptyValue.Example]
EMPTY_USER_VALUE = { default_value = "", scope = "User", mode = "replace", editable = false }

[DualScope.Example]
APP_HOME = { default_value = 'C:\Tools\ExampleApp', scope = "User", mode = "replace", editable = true }
Path = [
    { default_value = 'C:\Tools\ExampleApp\UserBin', scope = "User", mode = "+append", editable = false },
    { default_value = 'C:\Tools\ExampleApp\SystemBin', scope = "System", mode = "-append", editable = false },
]

["示例工具"."默认方案"]
EXAMPLE_MODE = { default_value = "safe-demo", scope = "User", mode = "replace", editable = true, choices = [{ label = "安全演示", value = "safe-demo" }, { label = "兼容演示", value = "compat-demo" }] }
